name: Release Playlite
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0
      - run: python -m build
      - name: Verify core-only distribution
        run: python tools/check_distribution.py dist/*.whl
      - name: Check core without plugins
        run: |
          python -m pip install dist/*.whl
          QT_QPA_PLATFORM=offscreen XDG_DATA_HOME="$RUNNER_TEMP/playlite-clean" python -m unittest discover -s tests -q
      - name: Prepare release checksums
        run: |
          cp install.sh dist/install.sh
          python -c "import urllib.request; urllib.request.urlretrieve('https://bootstrap.pypa.io/pip/pip.pyz', 'dist/pip.pyz')"
          cd dist
          sha256sum *.whl *.tar.gz install.sh pip.pyz > SHA256SUMS
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
