[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "playlite"
dynamic = ["version"]
description = "A native Linux game library"
requires-python = ">=3.10"
dependencies = ["PyQt6>=6.6,<7", "Pillow>=10,<13"]

[project.scripts]
playlite = "playlite.app:main"
playlite-cli = "playlite.cli:main"
playlite-plugins = "playlite.plugin_manager:main"
playlite-installer = "playlite.installer:main"

[tool.setuptools.packages.find]
include = ["playlite*"]

[tool.setuptools.dynamic]
version = {attr = "playlite.__version__"}

[tool.setuptools.package-data]
playlite = ["assets/*"]
