[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "playlite"
dynamic = ["version"]
license-files = ["licenses/Playnite-MIT.txt"]
description = "A native Linux game library"
requires-python = ">=3.10"
dependencies = ["PyQt6>=6.6,<7", "Pillow>=10,<13", "PyYAML>=6,<7", "vdf>=3.4,<4"]

[project.scripts]
playlite = "playlite.app:main"
playlite-cli = "playlite.cli:main"
playlite-plugins = "playlite.plugin_manager:main"
playlite-installer = "playlite.installer:main"

[tool.setuptools.packages.find]
include = ["playlite*"]

[tool.setuptools.dynamic]
version = {attr = "playlite.__version__"}

[tool.setuptools.package-data]
playlite = ["assets/*"]
